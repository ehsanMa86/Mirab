name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/license_headers.py --check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_arch: win64_mingw
            qt_tools: tools_mingw1310,qt.tools.win64_mingw1310
          - os: macos-14
            qt_arch: clang_64
            qt_tools: ""
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
            qt_tools: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1-dev libfreetype-dev libegl1

      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}
          cache: true

      - name: MinGW on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$RUNNER_WORKSPACE/Qt/Tools/mingw1310_64/bin" >> "$GITHUB_PATH"
          echo "${QT_ROOT_DIR}/../../Tools/mingw1310_64/bin" >> "$GITHUB_PATH"
          choco install ninja -y --no-progress

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            MINGW_BIN="$(cygpath -m "$RUNNER_WORKSPACE")/Qt/Tools/mingw1310_64/bin"
            EXTRA="-DCMAKE_C_COMPILER=$MINGW_BIN/gcc.exe -DCMAKE_CXX_COMPILER=$MINGW_BIN/g++.exe"
          fi
          cmake --preset release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" $EXTRA

      - name: Build
        run: cmake --build --preset release

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export PATH="$QT_ROOT_DIR/bin:$PATH"; fi
          ctest --preset release

      - name: Engine report
        shell: bash
        run: ./build/release/bin/anahita-cli engines

  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset headless
      - run: cmake --build --preset headless
      - run: ctest --preset headless
