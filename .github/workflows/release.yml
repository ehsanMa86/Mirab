name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the publish job writes; it asks for its own permissions.
permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  # linuxdeploy and its Qt plugin at fixed releases, checked before they run.
  LINUXDEPLOY_TAG: "1-alpha-20251107-1"
  LINUXDEPLOY_SHA256: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
  LINUXDEPLOY_QT_TAG: "1-alpha-20250213-1"
  LINUXDEPLOY_QT_SHA256: "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true
      - name: Toolchain on PATH
        shell: bash
        run: |
          echo "$RUNNER_WORKSPACE/Qt/Tools/mingw1310_64/bin" >> "$GITHUB_PATH"
          echo "${QT_ROOT_DIR}/../../Tools/mingw1310_64/bin" >> "$GITHUB_PATH"
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
          choco install ninja -y --no-progress
      - shell: bash
        run: |
          MINGW_BIN="$(cygpath -m "$RUNNER_WORKSPACE")/Qt/Tools/mingw1310_64/bin"
          cmake --preset release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"             -DCMAKE_C_COMPILER="$MINGW_BIN/gcc.exe" -DCMAKE_CXX_COMPILER="$MINGW_BIN/g++.exe"
      - run: cmake --build --preset release
      - shell: bash
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          ctest --preset release
      - run: cmake --build --preset release --target package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/release/Mirab-*.exe
            build/release/Mirab-*.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel] # Apple silicon, Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install ninja
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
      - run: cmake --preset release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - run: cmake --build --preset release
      - run: ctest --preset release
      - run: cmake --build --preset release --target package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}
          path: build/release/Mirab-*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1-dev libfreetype-dev libegl1 libfuse2 file
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - run: cmake --preset release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_INSTALL_PREFIX=/usr
      - run: cmake --build --preset release
      - run: ctest --preset release
      - run: cmake --build --preset release --target package
      - name: AppImage
        run: |
          # Qt's deploy step ignores DESTDIR, so install with an explicit prefix.
          cmake --install build/release --prefix "$PWD/AppDir/usr"
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_QT_TAG}/linuxdeploy-plugin-qt-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy-x86_64.AppImage" | sha256sum -c
          echo "${LINUXDEPLOY_QT_SHA256}  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$PWD/AppDir/usr/lib:$LD_LIBRARY_PATH"
          VERSION=$(grep -m1 -oP '^\s+VERSION \K[0-9.]+' CMakeLists.txt)
          export LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/io.github.ehsanma86.Mirab.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/mirab.png \
            --executable AppDir/usr/bin/mirab
          mv Mirab-*.AppImage "build/release/Mirab-${VERSION}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            build/release/Mirab-*.AppImage
            build/release/Mirab-*.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance
      attestations: write  # store it with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum Mirab-* > "Mirab-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"
      # Lets anyone check that a download was built here from this tag:
      #   gh attestation verify <file> --repo ehsanMa86/Mirab
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Mirab-*
      # Releases are immutable once published, so prereleases, which the action
      # would publish before uploading, are left as drafts to publish by hand.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: ${{ contains(github.ref_name, '-') }}
