name: Feature request
description: Suggest a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the modeling task or workflow, not only the feature.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Other software you use for it, or the workaround you use in Mirab.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
