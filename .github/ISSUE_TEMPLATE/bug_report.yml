name: Bug report
description: Something in Mirab does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. A small model that shows it is the most useful thing you can attach.
  - type: input
    id: version
    attributes:
      label: Mirab version
      description: Help > About Mirab, or `mirab-cli version`.
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - EPA EPANET 2.2
        - OWA EPANET 2.3
        - EPANET-MSX 2.0
        - EPA SWMM 5.2
        - SWMM5+ 1.0
        - Not related to an engine
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open examples/epanet/mirab-demo.inp
        2. ...
  - type: textarea
    id: files
    attributes:
      label: Input file and messages
      description: Attach the smallest .inp file that shows the problem, if you can share it, and paste any error message or status report.
